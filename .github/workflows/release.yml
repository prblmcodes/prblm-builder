name: Release files

# When a version tag (v0.8.0, …) is pushed: run the tests, build the wheel and source
# archive, and attach them to that tag's GitHub release. If the release doesn't exist yet,
# a draft is created — write its notes and publish it as usual.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e . build
      - run: python runtests.py
      - name: Tag matches the package version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != version $version in pyproject.toml"; exit 1; }
      - run: python -m build
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
              --notes "See CHANGELOG.md for what changed."
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
