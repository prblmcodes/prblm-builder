name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python -W error::DeprecationWarning runtests.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Wheel ships templates + static files
        run: |
          python -m zipfile -l dist/*.whl | grep -q "templates/prblm_builder/builder.html"
          python -m zipfile -l dist/*.whl | grep -q "static/prblm_builder/builder.js"
          python -m zipfile -l dist/*.whl | grep -q "blocks/static/prblm_builder/blocks/blocks.css"
          python -m zipfile -l dist/*.whl | grep -q "blocks/templates/prblm_builder/blocks/hero.html"
          python -m zipfile -l dist/*.whl | grep -q "blocks/migrations/0001_initial.py"
          python -m zipfile -l dist/*.whl | grep -q "blocks/migrations/0002_headers_footers.py"
          python -m zipfile -l dist/*.whl | grep -q "static/prblm_builder/fold.js"
          python -m zipfile -l dist/*.whl | grep -q "blocks/static/prblm_builder/blocks/link-block.js"
          python -m zipfile -l dist/*.whl | grep -q "blocks/migrations/0003_link_types.py"
          python -m zipfile -l dist/*.whl | grep -q "static/prblm_builder/form-columns.js"
          python -m zipfile -l dist/*.whl | grep -q "static/prblm_builder/form-columns.css"
          python -m zipfile -l dist/*.whl | grep -q "static/prblm_builder/form-columns-site.css"
          python -m zipfile -l dist/*.whl | grep -q "prblm_builder/templatetags/prblm_builder_tags.py"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
