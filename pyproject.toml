[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prblm-builder"
version = "0.5.0"
description = "A visual drag-and-drop page builder for Wagtail — compose pages from a site's existing StreamField blocks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "prblmcodes" }]
requires-python = ">=3.12"
dependencies = [
    "wagtail>=8.1,<9",
    "Django>=6.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 8",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.setuptools.packages.find]
include = ["prblm_builder*"]

[tool.setuptools.package-data]
prblm_builder = ["templates/**/*", "static/**/*"]
"prblm_builder.blocks" = ["templates/**/*", "static/**/*"]

[project.urls]
Homepage = "https://github.com/prblmcodes/prblm-builder"
Repository = "https://github.com/prblmcodes/prblm-builder"
